<!DOCTYPE html>
<html lang="en" {{HTML_ATTRS}}>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="theme-color" content="{{THEME_COLOR}}">
  {{CANONICAL}}
  {{OG}}
  <script src="/js/boot.js"></script>
  {{PRELOAD}}
  <link rel="stylesheet" href="/css/style.css">
  {{JSONLD}}
</head>
<body>
  <a href="#app" class="skip-link" id="skip-link">Skip to content</a>
  <div class="read-progress" id="read-progress" aria-hidden="true"></div>

  <header class="pill-wrap">
    <div class="pill-head" id="pill-head">
      <a href="/" class="wordmark" id="brand"></a>
      <nav class="pill-nav" id="pill-nav" aria-label="Main"></nav>
      <button type="button" class="pill-btn" id="search-btn" aria-label="Search" aria-haspopup="dialog"></button>
      <button type="button" class="menu-btn" id="menu-btn" aria-label="Open menu" aria-expanded="false" aria-controls="menu"></button>
    </div>
  </header>

  <div class="menu" id="menu" role="dialog" aria-modal="true" aria-label="Menu" hidden>
    <div class="menu__top">
      <a href="/" class="wordmark" id="menu-brand"></a>
      <button type="button" class="menu-btn" id="menu-close" aria-label="Close menu"></button>
    </div>
    <nav class="menu__pages" id="menu-pages" aria-label="Pages"></nav>
    <div class="menu__more" id="menu-more"></div>
  </div>

  <main id="app" tabindex="-1"></main>

  <footer class="site-footer" id="site-footer"></footer>

  <div class="cta-float" id="cta-float" hidden></div>
  <div id="theme-root"></div>
  <div id="chat-widget-root"></div>
  <div id="cmd-root"></div>

  <script src="/vendor/purify-3.4.0.min.js"></script>
  <script src="/vendor/marked-18.0.2.umd.js"></script>
  <script src="/js/theme-core.js"></script>
  <script src="/js/icons.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/pages/home.js"></script>
  <script src="/js/pages/about.js"></script>
  <script src="/js/pages/repos.js"></script>
  <script src="/js/pages/tools.js"></script>
  <script src="/js/pages/collab.js"></script>
  <script src="/js/pages/templates.js"></script>
  <script src="/js/pages/faq.js"></script>
  <script src="/js/chat-widget.js"></script>
  <script src="/js/chrome.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
