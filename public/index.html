<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AdvaySocialSuite</title>
  <meta name="description" content="Portfolio and tools hub.">
  <script>
    /* Runs before first paint so the saved theme and accent colour never flash. */
    (function () {
      var r = document.documentElement;
      try {
        var t = localStorage.getItem('adv_theme');
        if (t === 'light' || t === 'dark') r.setAttribute('data-theme', t);
        var a = JSON.parse(localStorage.getItem('adv_accent') || 'null');
        if (a && a.a) {
          r.style.setProperty('--accent', a.a);
          r.style.setProperty('--on-accent', a.o);
          r.style.setProperty('--accent-fg-light', a.l);
          r.style.setProperty('--accent-fg-dark', a.d);
        }
      } catch (e) { /* storage blocked: defaults apply */ }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
</head>
